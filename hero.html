<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 업무비서 만들기 · 실무 활용 마스터클래스</title>
<meta name="description" content="디자인·코딩을 몰라도 2시간 만에 보고서·홍보물·반복 업무를 처리하는 나만의 AI 업무비서를 만드는 실습형 강의입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="디자인·코딩 0점도 2시간 만에 완성하는 나만의 AI 업무비서">
<meta property="og:description" content="작성·디자인·자동화를 하나의 흐름으로 연결하는 실습 중심 강의">
<meta property="og:image" content="images/instructor.jpg">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<style>
  /* ---------------------------------------------------------------
     크기 체계
     캔버스 내부의 모든 수치는 1920x1080 기준 디자인 px 그대로 쓰고,
     --s(스케일 단위)를 곱해 컨테이너 폭에 맞춰 함께 줄어듭니다.
     예) font-size: calc(58 * var(--s))  →  디자인 시안의 58px
     수정할 때는 앞의 숫자만 바꾸면 됩니다.
  --------------------------------------------------------------- */

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html { background-color: #020b18; }

  body {
    background-color: #020b18;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #e6edf3;
    font-family: 'NanumSquare', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 16:9 규격 무대 (1920x1080 시안이 화면 폭에 맞춰 축소됨) */
  .hero-stage {
    position: relative;
    width: 100%;
    max-width: 1920px;
    aspect-ratio: 16 / 9;
    container-type: inline-size;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
  }

  .hero-canvas {
    --s: calc(100cqw / 1920);
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    background: radial-gradient(circle at 75% 45%, #1a365d 0%, #0a192f 45%, #020b18 100%);
    overflow: hidden;
  }

  /* 골드 앰비언트 라이트 및 럭셔리 라인 */
  .gold-glow {
    position: absolute;
    width: calc(700 * var(--s));
    height: calc(700 * var(--s));
    background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0) 70%);
    top: 15%;
    right: 10%;
    pointer-events: none;
    z-index: 1;
  }

  .accent-line-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(4 * var(--s));
    background: linear-gradient(90deg, transparent 0%, #d4af37 35%, #fff1b8 50%, #d4af37 65%, transparent 100%);
    z-index: 4;
  }

  /* 좌측 카피 & 제안 영역 */
  .content-container {
    width: 56%;
    height: 100%;
    padding: calc(110 * var(--s)) calc(50 * var(--s)) calc(100 * var(--s)) calc(120 * var(--s));
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 3;
  }

  .badge-tag {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    padding: calc(10 * var(--s)) calc(24 * var(--s));
    border-radius: calc(40 * var(--s));
    background: rgba(212, 175, 55, 0.12);
    border: 1px solid rgba(212, 175, 55, 0.45);
    color: #f5d77f;
    font-size: calc(20 * var(--s));
    font-weight: 700;
    letter-spacing: calc(1 * var(--s));
    margin-bottom: calc(28 * var(--s));
    box-shadow: 0 calc(4 * var(--s)) calc(15 * var(--s)) rgba(212, 175, 55, 0.1);
  }

  .main-headline {
    font-size: calc(58 * var(--s));
    font-weight: 800;
    line-height: 1.24;
    color: #ffffff;
    word-break: keep-all;
    margin-bottom: calc(24 * var(--s));
  }

  .highlight-gold {
    background-image: linear-gradient(135deg, #fff3c4 0%, #d4af37 50%, #aa8010 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  /* 그라디언트 텍스트 미지원 환경 대비 */
  @supports not ((background-clip: text) or (-webkit-background-clip: text)) {
    .highlight-gold {
      -webkit-text-fill-color: #f5d77f;
      color: #f5d77f;
    }
  }

  .sub-headline {
    font-size: calc(25 * var(--s));
    font-weight: 400;
    line-height: 1.55;
    color: #a3b8cc;
    word-break: keep-all;
    margin-bottom: calc(42 * var(--s));
  }

  /* 3대 핵심 베네핏 불릿 카드 */
  .bullet-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: calc(16 * var(--s));
    margin-bottom: calc(44 * var(--s));
  }

  .bullet-item {
    display: flex;
    align-items: center;
    gap: calc(16 * var(--s));
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left: calc(4 * var(--s)) solid #d4af37;
    padding: calc(16 * var(--s)) calc(22 * var(--s));
    border-radius: 0 calc(10 * var(--s)) calc(10 * var(--s)) 0;
  }

  .bullet-icon {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: calc(28 * var(--s));
    height: calc(28 * var(--s));
    background: rgba(212, 175, 55, 0.2);
    border-radius: 50%;
    color: #f5d77f;
    font-weight: 800;
    font-size: calc(16 * var(--s));
  }

  .bullet-text {
    font-size: calc(20 * var(--s));
    font-weight: 700;
    color: #e6edf3;
    word-break: keep-all;
  }

  /* 하단 확신 문구 및 CTA */
  .action-block {
    display: flex;
    flex-direction: column;
    gap: calc(16 * var(--s));
  }

  .trust-statement {
    display: flex;
    align-items: center;
    gap: calc(10 * var(--s));
    font-size: calc(18 * var(--s));
    font-weight: 400;
    color: #9bb0c9;
    word-break: keep-all;
  }

  .trust-statement .star {
    color: #d4af37;
    font-size: calc(20 * var(--s));
  }

  .cta-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: calc(12 * var(--s));
    width: fit-content;
    padding: calc(22 * var(--s)) calc(54 * var(--s));
    border-radius: calc(12 * var(--s));
    background: linear-gradient(135deg, #f5d77f 0%, #d4af37 60%, #b8860b 100%);
    color: #0b1320;
    font-size: calc(26 * var(--s));
    font-weight: 800;
    text-decoration: none;
    white-space: nowrap;
    word-break: keep-all;
    box-shadow: 0 calc(12 * var(--s)) calc(30 * var(--s)) rgba(212, 175, 55, 0.35);
    border: 1px solid #fff1b8;
  }

  .cta-button:hover,
  .cta-button:focus-visible {
    background: linear-gradient(135deg, #fff3c4 0%, #e8c351 60%, #c9930d 100%);
    outline: none;
  }

  .cta-button:focus-visible {
    box-shadow: 0 0 0 calc(4 * var(--s)) rgba(245, 215, 127, 0.5);
  }

  /* 우측 전문가 비주얼 영역 */
  .instructor-container {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 44%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 2;
  }

  .instructor-frame {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  .instructor-photo {
    max-width: 100%;
    height: 96%;
    object-fit: contain;
    object-position: bottom;
    filter: drop-shadow(0 calc(20 * var(--s)) calc(40 * var(--s)) rgba(0, 0, 0, 0.8));
    mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
  }

  /* 사진 파일이 아직 없을 때 자리 표시 (파일을 넣으면 자동으로 사라집니다) */
  .instructor-frame.is-missing::after {
    content: "강사 사진 위치\A images/instructor.jpg";
    white-space: pre-line;
    align-self: flex-end;
    width: 78%;
    height: 88%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: calc(60 * var(--s));
    border: 1px dashed rgba(212, 175, 55, 0.35);
    border-bottom: none;
    border-radius: calc(24 * var(--s)) calc(24 * var(--s)) 0 0;
    background: linear-gradient(to bottom, rgba(212, 175, 55, 0.06), rgba(212, 175, 55, 0));
    color: rgba(245, 215, 127, 0.65);
    font-size: calc(20 * var(--s));
    font-weight: 700;
    text-align: center;
    line-height: 1.6;
  }

  /* 전문가 사진 뒤 골드 서클 프레임 효과 */
  .prestige-ring {
    position: absolute;
    width: calc(720 * var(--s));
    height: calc(720 * var(--s));
    border-radius: 50%;
    border: 1px solid rgba(212, 175, 55, 0.25);
    bottom: calc(-120 * var(--s));
    right: calc(20 * var(--s));
    pointer-events: none;
    z-index: 1;
  }

  /* ---------------------------------------------------------------
     모바일·태블릿: 16:9를 풀고 세로 흐름으로 재배치
     축소만 하면 본문이 12px 이하로 작아지므로, 스케일 하한을 두고
     콘텐츠와 사진을 위아래로 나눕니다.
  --------------------------------------------------------------- */
  @media (max-width: 900px) {
    body { align-items: flex-start; }

    .hero-stage {
      aspect-ratio: auto;
      min-height: 100vh;
      box-shadow: none;
    }

    .hero-canvas {
      --s: clamp(0.5px, calc(0.075vw + 0.23px), 0.72px);
      flex-direction: column;
      height: auto;
      min-height: 100vh;
      background: radial-gradient(circle at 72% 16%, #1a365d 0%, #0a192f 45%, #020b18 100%);
    }

    .content-container {
      width: 100%;
      height: auto;
      order: 1;
      padding: clamp(48px, 12vw, 96px) clamp(24px, 6.5vw, 56px) clamp(28px, 7vw, 48px);
      gap: clamp(28px, 7vw, 44px);
    }

    /* 모바일은 스케일 축소만으로는 본문이 12px 이하로 작아지므로
       본문급 텍스트는 읽기 가능한 하한을 별도로 지정합니다. */
    .badge-tag {
      font-size: clamp(11px, 2.9vw, 18px);
      letter-spacing: 0.4px;
      padding: 0.62em 1.2em;
    }

    .sub-headline { font-size: clamp(15px, 4vw, 22px); }

    .bullet-item { padding: 0.85em 1.05em; }

    .bullet-icon {
      width: clamp(20px, 5vw, 26px);
      height: clamp(20px, 5vw, 26px);
      font-size: clamp(11px, 2.8vw, 15px);
    }

    .bullet-text { font-size: clamp(14.5px, 3.8vw, 20px); }

    .trust-statement { font-size: clamp(13px, 3.4vw, 17px); }

    .trust-statement .star { font-size: 1.15em; }

    .cta-button {
      width: 100%;
      white-space: normal;
      text-align: center;
      font-size: clamp(15px, 4.1vw, 24px);
      padding: 0.9em 1.1em;
      border-radius: 10px;
    }

    .instructor-container {
      position: relative;
      order: 2;
      width: 100%;
      height: auto;
      padding: 0 clamp(24px, 6.5vw, 56px);
    }

    .instructor-frame { height: auto; }

    .instructor-photo {
      height: auto;
      width: auto;
      max-height: 52vh;
    }

    .instructor-frame.is-missing::after {
      width: 100%;
      height: 38vh;
      padding-bottom: clamp(20px, 5vw, 36px);
    }

    .gold-glow {
      top: 2%;
      right: -10%;
    }

    .prestige-ring { display: none; }
  }
</style>
</head>
<body>

<main class="hero-stage">
  <section class="hero-canvas" aria-labelledby="hero-headline">
    <span class="accent-line-top" aria-hidden="true"></span>
    <span class="gold-glow" aria-hidden="true"></span>
    <span class="prestige-ring" aria-hidden="true"></span>

    <!-- 왼쪽 콘텐츠 텍스트 구성 -->
    <div class="content-container">
      <div>
        <p class="badge-tag">EXECUTIVE AI WORKFLOW MASTERCLASS</p>
        <h1 class="main-headline" id="hero-headline">
          디자인·코딩 0점도<br>
          <span class="highlight-gold">2시간 만에 완성</span>하는<br>
          나만의 AI 업무비서
        </h1>
        <p class="sub-headline">
          질문하는 단계를 넘어, 작성·디자인·자동화까지<br>
          하나의 흐름으로 연결하는 실무 활용법
        </p>

        <ul class="bullet-list">
          <li class="bullet-item">
            <span class="bullet-icon" aria-hidden="true">✓</span>
            <span class="bullet-text">보고서·보도자료·이메일 초안 자동 생성</span>
          </li>
          <li class="bullet-item">
            <span class="bullet-icon" aria-hidden="true">✓</span>
            <span class="bullet-text">디자인 툴 없이 홍보 포스터 &amp; PPT 이미지 즉시 제작</span>
          </li>
          <li class="bullet-item">
            <span class="bullet-icon" aria-hidden="true">✓</span>
            <span class="bullet-text">반복되는 회의록·요약·체크리스트 업무 프로세스 자동화</span>
          </li>
        </ul>
      </div>

      <div class="action-block">
        <p class="trust-statement">
          <span class="star" aria-hidden="true">★</span> 초보자도 당일 업무에 적용하는 실습 중심 가이드 제공
        </p>
        <a href="#apply" class="cta-button">
          지금 수강 신청하고 AI 업무비서 만들기 <span aria-hidden="true">→</span>
        </a>
      </div>
    </div>

    <!-- 오른쪽 강사 프로필 비주얼 영역 -->
    <figure class="instructor-container">
      <div class="instructor-frame">
        <img
          src="images/instructor.jpg"
          alt="AI 실무 전문강사 프로필 사진"
          class="instructor-photo"
          onerror="this.parentNode.classList.add('is-missing'); this.remove();">
      </div>
    </figure>
  </section>
</main>

</body>
</html>
